<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#f4f7fb"/>
  <text x="480" y="36" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="#0b3d5c" font-weight="bold">Dashcam SoC  Top-Level Integration</text>

  <!-- Masters -->
  <rect x="40" y="70" width="140" height="48" rx="4" fill="#d9eaf5" stroke="#0b3d5c"/>
  <text x="110" y="98" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#0b3d5c">ext WB (USE_CPU=0)</text>
  <rect x="40" y="130" width="140" height="48" rx="4" fill="#d9eaf5" stroke="#0b3d5c"/>
  <text x="110" y="158" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#0b3d5c">picoRV32 (USE_CPU=1)</text>
  <rect x="40" y="190" width="140" height="48" rx="4" fill="#cfe8de" stroke="#0b5c45"/>
  <text x="110" y="218" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#0b5c45">dma_engine master</text>

  <rect x="220" y="130" width="110" height="60" rx="4" fill="#ffe8c8" stroke="#8a5a00"/>
  <text x="275" y="165" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#8a5a00">Master mux</text>

  <rect x="370" y="120" width="150" height="80" rx="4" fill="#e8e0f0" stroke="#4a3a6a"/>
  <text x="445" y="155" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#4a3a6a">wb_interconnect</text>
  <text x="445" y="175" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#4a3a6a">CSR | SRAM windows</text>

  <!-- CSR block -->
  <rect x="560" y="60" width="360" height="160" rx="6" fill="#eef6ff" stroke="#0b3d5c"/>
  <text x="740" y="82" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#0b3d5c" font-weight="bold">CSR 0x1000_0000  address_decode</text>
  <rect x="580" y="100" width="60" height="36" rx="3" fill="#fff" stroke="#0b3d5c"/><text x="610" y="122" text-anchor="middle" font-size="11" font-family="Helvetica,Arial,sans-serif">cam</text>
  <rect x="650" y="100" width="60" height="36" rx="3" fill="#fff" stroke="#0b3d5c"/><text x="680" y="122" text-anchor="middle" font-size="11" font-family="Helvetica,Arial,sans-serif">dma</text>
  <rect x="720" y="100" width="60" height="36" rx="3" fill="#fff" stroke="#0b3d5c"/><text x="750" y="122" text-anchor="middle" font-size="11" font-family="Helvetica,Arial,sans-serif">irq</text>
  <rect x="790" y="100" width="60" height="36" rx="3" fill="#fff" stroke="#0b3d5c"/><text x="820" y="122" text-anchor="middle" font-size="11" font-family="Helvetica,Arial,sans-serif">iomux</text>
  <rect x="650" y="155" width="70" height="36" rx="3" fill="#fff" stroke="#0b3d5c"/><text x="685" y="177" text-anchor="middle" font-size="11" font-family="Helvetica,Arial,sans-serif">sdspi</text>
  <text x="740" y="205" text-anchor="middle" font-size="10" font-family="Helvetica,Arial,sans-serif" fill="#335">+100 / +200 / +300 / +400 apertures</text>

  <!-- SRAM -->
  <rect x="560" y="240" width="200" height="50" rx="4" fill="#dcefe4" stroke="#0b5c45"/>
  <text x="660" y="270" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#0b5c45">sram_ctrl @ 0x2000_0000</text>

  <!-- Datapath -->
  <rect x="40" y="300" width="130" height="50" rx="4" fill="#cfe8de" stroke="#0b5c45"/>
  <text x="105" y="330" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#0b5c45">cam_capture</text>
  <rect x="220" y="300" width="130" height="50" rx="4" fill="#cfe8de" stroke="#0b5c45"/>
  <text x="285" y="330" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#0b5c45">dma_engine</text>
  <rect x="400" y="300" width="130" height="50" rx="4" fill="#cfe8de" stroke="#0b5c45"/>
  <text x="465" y="330" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#0b5c45">sram_ctrl</text>

  <!-- IRQ -->
  <rect x="220" y="400" width="280" height="70" rx="4" fill="#fde8e8" stroke="#7a2020"/>
  <text x="360" y="430" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#7a2020" font-weight="bold">irq_ctrl</text>
  <text x="360" y="450" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#7a2020">bit0 CAM · bit1 DMA · bit2 SDSPI ’ irq_out</text>

  <!-- Arrows -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#333"/></marker>
  </defs>
  <line x1="180" y1="94" x2="220" y2="150" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="180" y1="154" x2="220" y2="160" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="180" y1="214" x2="220" y2="170" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="330" y1="160" x2="370" y2="160" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="520" y1="145" x2="560" y2="140" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="520" y1="175" x2="560" y2="265" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="170" y1="325" x2="220" y2="325" stroke="#0b5c45" marker-end="url(#arrow)"/>
  <line x1="350" y1="325" x2="400" y2="325" stroke="#0b5c45" marker-end="url(#arrow)"/>
  <line x1="105" y1="350" x2="280" y2="400" stroke="#7a2020" marker-end="url(#arrow)"/>
  <line x1="285" y1="350" x2="320" y2="400" stroke="#7a2020" marker-end="url(#arrow)"/>
  <line x1="500" y1="430" x2="560" y2="430" stroke="#7a2020"/>
  <text x="700" y="500" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555">See docs/integration.md  OpenTitan-style hierarchical CSR map</text>
</svg>
